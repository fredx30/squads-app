name: Setup signing keys

# Creates this repo's signing keys as Actions secrets. Manual, overwrites on every run.
# Keys are self-signed placeholders (release CN contains PLACEHOLDER) until the real Google
# Play key is set by hand into KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD;
# a release key without the marker is only overwritten with replace_real_release_key ticked.
# Needs SIGNING_SETUP_TOKEN: a fine-grained PAT for this repo with "Secrets: read and write"
# (GITHUB_TOKEN cannot write secrets). Forks inherit no secrets and run this themselves.
# No checkout, keys shredded after upload, no backup exists.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Which keystores to (re)create'
        type: choice
        options: [both, debug, release]
        default: both
      replace_real_release_key:
        description: 'Also overwrite a hand-inserted release key (no PLACEHOLDER marker). Destroys the real signing identity.'
        type: boolean
        default: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SIGNING_SETUP_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PLACEHOLDER_MARK: PLACEHOLDER
    steps:
      - name: Check the setup token
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SIGNING_SETUP_TOKEN is not set (fine-grained PAT for $GH_REPO with 'Secrets: read and write')."
            exit 1
          fi
          n=$(gh api "repos/$GH_REPO/actions/secrets" --jq '.total_count')
          echo "OK: token can read secrets on $GH_REPO ($n existing)"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Assert no key material present
        run: |
          set -euo pipefail
          for v in ANDROID_USER_HOME ANDROID_SDK_HOME ANDROID_PREFS_ROOT; do
            if [ -n "${!v:-}" ]; then echo "::error::$v is set on the runner"; exit 1; fi
          done
          if [ -e "$HOME/.android/debug.keystore" ]; then echo "::error::$HOME/.android/debug.keystore exists before generation"; exit 1; fi
          if ls ./*.keystore ./*.jks > /dev/null 2>&1; then echo "::error::keystore files in the working directory"; exit 1; fi
          echo "## Placeholder self-signed keys" >> "$GITHUB_STEP_SUMMARY"
          echo "No external trust. Replace with the real Google Play key by hand (see workflow header)." >> "$GITHUB_STEP_SUMMARY"

      - name: Debug keystore
        if: inputs.keys != 'release'
        run: |
          set -euo pipefail
          ks=$(mktemp -d)/debug.keystore
          keytool -genkeypair -v \
            -keystore "$ks" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey | tee keytool.txt
          fp=$(sed -n 's/^[[:space:]]*SHA256: //p' keytool.txt | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$fp"
          base64 -w0 "$ks" | gh secret set DEBUG_KEYSTORE_BASE64 --repo "$GH_REPO"
          shred -u "$ks" keytool.txt
          {
            echo "### Debug key (replaced)"
            echo "- Secret \`DEBUG_KEYSTORE_BASE64\`, signer SHA-256 \`$fp\`"
            echo "- Devices with a debug build signed by the previous key need an uninstall."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard the real release key
        if: inputs.keys != 'debug'
        env:
          CURRENT_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CURRENT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CURRENT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          REPLACE_REAL: ${{ inputs.replace_real_release_key }}
        run: |
          set -euo pipefail
          if [ -z "$CURRENT_KEYSTORE_BASE64" ]; then echo "No KEYSTORE_BASE64 yet; nothing to guard."; exit 0; fi
          cur=$(mktemp -d)/current.keystore
          echo "$CURRENT_KEYSTORE_BASE64" | base64 -d > "$cur"
          if ! keytool -list -v -keystore "$cur" -storepass "$CURRENT_KEYSTORE_PASSWORD" \
               -alias "$CURRENT_KEY_ALIAS" > current.txt 2>&1; then
            echo "::warning::existing KEYSTORE_BASE64 does not open with KEYSTORE_PASSWORD/KEY_ALIAS; treating it as replaceable"
            shred -u "$cur"; rm -f current.txt
            exit 0
          fi
          subject=$(sed -n 's/^Owner: //p' current.txt | head -1)
          fp=$(sed -n 's/^[[:space:]]*SHA256: //p' current.txt | tr -d ':' | tr 'A-F' 'a-f')
          shred -u "$cur"; rm -f current.txt
          echo "current release signer: $subject (SHA-256 $fp)"
          if grep -q "$PLACEHOLDER_MARK" <<<"$subject"; then echo "Placeholder key; replacing."; exit 0; fi
          if [ "$REPLACE_REAL" = true ]; then
            echo "::warning::Replacing a hand-inserted release key ($subject). The app's signing identity changes."
            exit 0
          fi
          echo "::error::Current release key was inserted by hand ($subject); refusing to overwrite. Tick replace_real_release_key or run with keys=debug."
          exit 1

      - name: Release keystore
        if: inputs.keys != 'debug'
        run: |
          set -euo pipefail
          store_pw=$(openssl rand -hex 32); key_pw=$(openssl rand -hex 32)
          echo "::add-mask::$store_pw"; echo "::add-mask::$key_pw"
          alias=release
          subject="CN=$PLACEHOLDER_MARK self-signed release key (not Google Play), OU=setup-signing workflow, O=${GH_REPO%%/*}"
          ks=$(mktemp -d)/release.keystore
          keytool -genkeypair -v \
            -keystore "$ks" -storepass "$store_pw" -keypass "$key_pw" \
            -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "$subject"
          keytool -list -v -keystore "$ks" -storepass "$store_pw" -alias "$alias" | tee keytool.txt
          fp=$(sed -n 's/^[[:space:]]*SHA256: //p' keytool.txt | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$fp"
          # Keystore last: a failure part-way leaves signing unconfigured, not mismatched.
          gh secret set KEYSTORE_PASSWORD --repo "$GH_REPO" --body "$store_pw"
          gh secret set KEY_ALIAS        --repo "$GH_REPO" --body "$alias"
          gh secret set KEY_PASSWORD     --repo "$GH_REPO" --body "$key_pw"
          base64 -w0 "$ks" | gh secret set KEYSTORE_BASE64 --repo "$GH_REPO"
          shred -u "$ks" keytool.txt
          {
            echo "### Release key (replaced): PLACEHOLDER, self-signed"
            echo "- Subject \`$subject\`, signer SHA-256 \`$fp\`"
            echo "- Not a Google Play key. App identity changed: previous installs must be removed first."
          } >> "$GITHUB_STEP_SUMMARY"
