name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build a debug APK (com.squads.app.dev, signed with the runner debug key) instead of a release'
        type: boolean
        default: false

# Deny-by-default at workflow level; permissions are granted per job below.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only by softprops/action-gh-release to create the
    # GitHub Release and upload the APK. Scoped to this job (the only one).
    permissions:
      contents: write

    # Actions are pinned to full commit SHAs (tag in trailing comment) so a
    # moved or compromised tag cannot inject code. Dependabot keeps them current.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Decode keystore
        if: inputs.debug != true && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK
        if: inputs.debug != true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Manual escape hatch while release signing is unconfigured, or for sharing a
      # test build. Debug APKs are signed with the runner's auto-generated debug key,
      # so they cannot update in place over an APK installed from a local `just run`.
      - name: Build debug APK
        if: inputs.debug == true
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.debug == true && 'squads-debug-apk' || 'squads-release-apk' }}
          path: app/build/outputs/apk/${{ inputs.debug == true && 'debug' || 'release' }}/*.apk

      # Only tag pushes publish. A manual dispatch run on a tag ref (debug or not)
      # must never create or overwrite a GitHub Release.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
