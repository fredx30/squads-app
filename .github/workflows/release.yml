name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build a debug APK (com.squads.app.dev, signed with the runner debug key) instead of a release'
        type: boolean
        default: false

# Deny-by-default at workflow level; permissions are granted per job below.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is needed only by softprops/action-gh-release to create the
    # GitHub Release and upload the APK. Scoped to this job (the only one).
    permissions:
      contents: write

    # Actions are pinned to full commit SHAs (tag in trailing comment) so a
    # moved or compromised tag cannot inject code. Dependabot keeps them current.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Decode keystore
        if: inputs.debug != true && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK
        if: inputs.debug != true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Record release APK signer
        if: inputs.debug != true
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          {
            echo "### Release APK signer"
            echo "- APK: \`$(basename "$apk")\`, sha256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- Signer certificate SHA-256: \`$(sed -n 's/^.*Signer: certificate SHA-256 digest: //p' apksigner.txt | sort -u | paste -sd' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Debug path (manual run with the "debug" box ticked) ----
      # Manual escape hatch while release signing is unconfigured, or for sharing a
      # test build. The signer is a throwaway key that exists only for this run, so
      # every step is explicit and the run log is the complete record of it:
      #   1. assert the runner holds no key material and nothing redirects the
      #      debug keystore location away from ~/.android
      #   2. generate the key with keytool, parameters and fingerprint logged
      #   3. build
      #   4. assert the APK carries exactly one signer and it is that key
      # AGP would otherwise generate ~/.android/debug.keystore silently inside
      # validateSigningDebug; step 2 pre-empts that so nothing is created unlogged.
      - name: Assert no key material present
        if: inputs.debug == true
        run: |
          set -euo pipefail
          fail=0
          for v in ANDROID_USER_HOME ANDROID_SDK_HOME ANDROID_PREFS_ROOT; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set to '${!v}', so the debug keystore would not resolve to ~/.android"
              fail=1
            fi
          done
          for f in "$HOME/.android/debug.keystore" app/release.keystore; do
            if [ -e "$f" ]; then
              echo "::error::$f exists before the build"
              fail=1
            fi
          done
          found=$(find . -path ./.git -prune -o \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' -o -name '*.pfx' -o -name '*.pem' \) -print)
          if [ -n "$found" ]; then
            echo "::error::key material found in the checkout:"
            echo "$found"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: HOME=$HOME, no keystore files, no key files in checkout, no keystore-location overrides"

      - name: Generate throwaway debug key
        if: inputs.debug == true
        id: debugkey
        run: |
          set -euo pipefail
          ks="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$ks")"
          # Standard Android debug credentials. The key is random, the passwords are
          # public by design, and the file is discarded with the runner.
          keytool -genkeypair -v \
            -keystore "$ks" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Android Debug, O=Android, C=US"
          keytool -list -v -keystore "$ks" -storepass android
          fp=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey \
               | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$fp"
          echo "sha256=$fp" >> "$GITHUB_OUTPUT"
          echo "Generated debug signer certificate SHA-256: $fp"

      - name: Build debug APK
        if: inputs.debug == true
        run: ./gradlew assembleDebug

      - name: Assert APK is signed by the generated key
        if: inputs.debug == true
        env:
          EXPECTED: ${{ steps.debugkey.outputs.sha256 }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          # --verbose prints one "<scheme> Signer: certificate SHA-256 digest:" line per
          # scheme; dedupe so a key used for v2 and v3 counts once.
          signers=$(sed -n 's/^Number of signers: //p' apksigner.txt)
          digests=$(sed -n 's/^.*Signer: certificate SHA-256 digest: //p' apksigner.txt | sort -u)
          ndigests=$(echo "$digests" | grep -c .)
          actual=$(echo "$digests" | head -1)
          echo "expected signer: $EXPECTED"
          echo "actual signer:   $actual (signers: $signers, distinct certs: $ndigests)"
          if [ "$signers" != "1" ] || [ "$ndigests" != "1" ]; then
            echo "::error::expected exactly one signer certificate, found signers=$signers distinct certs=$ndigests"
            exit 1
          fi
          if [ "$actual" != "$EXPECTED" ]; then echo "::error::APK signer does not match the key generated in this run"; exit 1; fi
          {
            echo "### Debug APK signer"
            echo "- APK: \`$(basename "$apk")\`, sha256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- Signer certificate SHA-256: \`$actual\`"
            echo "- Key generated in this run by keytool (see 'Generate throwaway debug key'); it is not retained."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.debug == true && 'squads-debug-apk' || 'squads-release-apk' }}
          path: app/build/outputs/apk/${{ inputs.debug == true && 'debug' || 'release' }}/*.apk

      # Only tag pushes publish. A manual dispatch run on a tag ref (debug or not)
      # must never create or overwrite a GitHub Release.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
